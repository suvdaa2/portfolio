<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>V-RACER 2000 // TIGHT CONTROLS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            --navy: #1a2a44;
            --grey: #4a4e5a;
            --burgundy: #630d16;
            --beige: #d8c3a5;
            --white: #ffffff;
        }

        body {
            margin: 0; background: #000; overflow: hidden;
            font-family: 'DotGothic16', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #game-wrap {
            position: relative; width: 800px; height: 600px;
            border: 4px solid var(--beige);
            box-shadow: 0 0 20px var(--burgundy);
        }

        canvas { display: block; image-rendering: pixelated; }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.85); color: var(--beige); text-align: center;
            z-index: 20;
        }

        .hud-top {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-around;
            z-index: 15;
        }

        .hud-item {
            background: var(--navy);
            color: var(--white);
            padding: 5px 20px;
            border: 2px solid var(--beige);
            font-size: 18px;
            box-shadow: 4px 4px 0px var(--burgundy);
        }

        button {
            padding: 15px 40px; font-size: 24px; cursor: pointer;
            background: var(--burgundy); color: var(--white);
            border: 4px solid var(--beige); font-family: 'DotGothic16', sans-serif;
        }

        button:hover { background: var(--beige); color: var(--navy); }

        h1 { font-size: 50px; text-shadow: 3px 3px var(--burgundy); margin: 0; }
    </style>
</head>
<body>

<div id="game-wrap">
    <canvas id="g"></canvas>
    <div class="hud-top">
        <div class="hud-item">VELOCITY: <span id="sp">0</span></div>
        <div class="hud-item">SYNC: <span id="pr">0</span>%</div>
    </div>
    <div id="overlay">
        <h1 id="title">V-RACER 2000</h1>
        <p id="subtitle">STREERING CALIBRATED // HIGH-VIS OBSTACLES LOADED</p>
        <button onclick="startGame()">ENGAGE</button>
    </div>
</div>

<script>
const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');
const spUI = document.getElementById('sp');
const prUI = document.getElementById('pr');
const overlay = document.getElementById('overlay');

const width = 800, height = 600;
canvas.width = width; canvas.height = height;

const roadW = 2000, segL = 200, camH = 1000, drawD = 200, fieldV = 100;
const camD = 1 / Math.tan((fieldV / 2) * Math.PI / 180);

let playerX = 0, speed = 0, pos = 0, segments = [], keys = {};
let gameState = 'START';
let totalTrackSegments = 800;

function buildTrack() {
    segments = [];
    for (let i = 0; i < totalTrackSegments; i++) {
        let curve = (i > 150 && i < 350) ? 2.5 : (i > 500 && i < 700) ? -2.5 : 0;
        let isStep = Math.floor(i / 3) % 2;
        segments.push({
            p1: { w: { x: 0, y: 0, z: i * segL }, s: {} },
            p2: { w: { x: 0, y: 0, z: (i + 1) * segL }, s: {} },
            curve: curve,
            color: {
                road: isStep ? '#222' : '#2a2a2a',
                grass: isStep ? '#1a2a44' : '#142135',
                rumble: isStep ? '#630d16' : '#d8c3a5',
                lane: isStep ? '#d8c3a5' : 'transparent'
            },
            objects: (i > 50 && i < totalTrackSegments - 50 && Math.random() > 0.94) ? [{ x: (Math.random() * 2) - 1, w: 0.6 }] : []
        });
    }
}

function project(p, camX, camY, camZ) {
    p.s.scale = camD / (p.w.z - camZ);
    p.s.x = (width/2) + (p.s.scale * (p.w.x - camX) * width/2);
    p.s.y = (height/2) - (p.s.scale * (p.w.y - camY) * height/2);
    p.s.w = p.s.scale * roadW * width/2;
}

function drawPolygon(x1, y1, w1, x2, y2, w2, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1); ctx.lineTo(x2 - w2, y2);
    ctx.lineTo(x2 + w2, y2); ctx.lineTo(x1 + w1, y1);
    ctx.fill();
}

function startGame() {
    playerX = 0; speed = 0; pos = 0;
    gameState = 'RACING';
    overlay.style.display = 'none';
    buildTrack();
}

function update(dt) {
    if (gameState !== 'RACING') return;

    if (keys[38]) speed += 4000 * dt;
    else if (keys[40]) speed -= 8000 * dt;
    else speed -= 2000 * dt;
    let steerSpeed = 0.05;
    if (keys[37]) playerX -= steerSpeed;
    if (keys[39]) playerX += steerSpeed;

    speed = Math.max(0, Math.min(speed, 10000));
    pos += speed * dt;
    playerX = Math.max(-2.2, Math.min(2.2, playerX));

    spUI.innerText = Math.floor(speed / 100);
    prUI.innerText = Math.floor((pos / (totalTrackSegments * segL)) * 100);

    if (pos >= (totalTrackSegments - 5) * segL) {
        gameState = 'FINISHED';
        document.getElementById('title').innerText = "SYSTEM SYNCED";
        overlay.style.display = 'flex';
    }
}

function render() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height);

    const baseS = segments[Math.floor(pos / segL) % segments.length];
    let x = 0, dx = -baseS.curve;

    for (let n = 0; n < drawD; n++) {
        const s = segments[(baseS.p1.w.z / segL + n) % segments.length];
        const camZ = pos - (s.p1.w.z < pos ? segments.length * segL : 0);
        project(s.p1, playerX * roadW - x, camH, camZ);
        project(s.p2, playerX * roadW - x - dx, camH, camZ);
        x += dx; dx += s.curve;

        if (s.p1.s.y <= s.p2.s.y) continue;

        ctx.fillStyle = s.color.grass;
        ctx.fillRect(0, s.p2.s.y, width, s.p1.s.y - s.p2.s.y);
        drawPolygon(s.p1.s.x, s.p1.s.y, s.p1.s.w * 1.05, s.p2.s.x, s.p2.s.y, s.p2.s.w * 1.05, s.color.rumble);
        drawPolygon(s.p1.s.x, s.p1.s.y, s.p1.s.w, s.p2.s.x, s.p2.s.y, s.p2.s.w, s.color.road);

        s.objects.forEach(obj => {
            const ox = s.p1.s.x + (obj.x * s.p1.s.w);
            const oy = s.p1.s.y;
            const ow = obj.w * s.p1.s.w;
            const oh = ow * 1.2;

            ctx.fillStyle = '#fff';
            ctx.fillRect(ox - ow/2 - 5, oy - oh - 5, ow + 10, oh + 10);
           
            ctx.fillStyle = '#630d16';
            ctx.fillRect(ox - ow/2, oy - oh, ow, oh);
            ctx.fillStyle = '#d8c3a5';
            ctx.fillRect(ox - ow/2, oy - oh + (oh*0.2), ow, oh*0.2);
            ctx.fillRect(ox - ow/2, oy - oh + (oh*0.6), ow, oh*0.2);

            if (gameState === 'RACING' && n < 8) {
                if (Math.abs(playerX - obj.x) < (obj.w/2 + 0.3)) {
                    gameState = 'GAMEOVER';
                    document.getElementById('title').innerText = "DISCONNECTED";
                    overlay.style.display = 'flex';
                }
            }
        });
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(width/2 - 40, height - 90, 80, 35);
    ctx.fillStyle = '#630d16';
    ctx.fillRect(width/2 - 35, height - 85, 70, 25);
}

function frame() {
    update(1/60);
    render();
    requestAnimationFrame(frame);
}

window.addEventListener('keydown', e => keys[e.keyCode] = true);
window.addEventListener('keyup', e => keys[e.keyCode] = false);
buildTrack();
frame();
</script>
<script>
document.addEventListener("keydown", function(event) {

    const gameKeys = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"
    ];

    if (gameKeys.includes(event.key)) {
        event.preventDefault();
    }

});
</script>
</body>
</html>
